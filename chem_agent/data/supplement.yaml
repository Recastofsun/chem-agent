ksp:
  # Fe(OH)3 и Al(OH)3 - аморфные свежеосажденные фазы: log Ksp = log_k(phreeqc.dat) - 3*14,0
  # (Fe(OH)3(a): log_k 4,891; Al(OH)3(a): log_k 10,8). Кристаллические фазы (гетит, гиббсит) в
  # лаборатории образуются медленно.
  - {formula: "Fe(OH)3", ions: {"Fe+3": 1, "OH-": 3}, ksp: 7.8e-38, sigma: 4.0, note: "аморфный, phreeqc.dat", dS_ref: {dHf: -823.0, dGf: -696.5}}
  - {formula: "Fe(OH)2", ions: {"Fe+2": 1, "OH-": 2}, ksp: 4.87e-17, sigma: 3.0}
  - {formula: "Al(OH)3", ions: {"Al+3": 1, "OH-": 3}, ksp: 6.3e-32, sigma: 4.0, note: "аморфный, phreeqc.dat"}
  - {formula: "Mn(OH)2", ions: {"Mn+2": 1, "OH-": 2}, ksp: 2.06e-13, sigma: 3.0}
  - {formula: "Cr(OH)3", ions: {"Cr+3": 1, "OH-": 3}, ksp: 6.3e-31, sigma: 5.0}
  - {formula: "Cu(OH)2", ions: {"Cu+2": 1, "OH-": 2}, ksp: 2.2e-20, sigma: 3.0}
  - {formula: "Pb(OH)2", ions: {"Pb+2": 1, "OH-": 2}, ksp: 1.43e-20, sigma: 3.0}
  - {formula: "Ag3PO4", ions: {"Ag+": 3, "PO4-3": 1}, ksp: 8.89e-17, sigma: 3.0}
  - {formula: "FePO4·2H2O", ions: {"Fe+3": 1, "PO4-3": 1, "H2O": 2}, ksp: 9.91e-16, sigma: 8.0}
  - {formula: "BaCrO4", ions: {"Ba+2": 1, "CrO4-2": 1}, ksp: 1.17e-10, sigma: 2.0}
  - {formula: "PbCrO4", ions: {"Pb+2": 1, "CrO4-2": 1}, ksp: 2.8e-13, sigma: 3.0}
  - {formula: "CaC2O4·H2O", ions: {"Ca+2": 1, "C2O4-2": 1, "H2O": 1}, ksp: 2.32e-9, sigma: 2.0}
  - {formula: "CaSO3·0.5H2O", ions: {"Ca+2": 1, "SO3-2": 1, "H2O": 0.5}, ksp: 3.1e-7, sigma: 3.0}
  - {formula: "Mg3(PO4)2", ions: {"Mg+2": 3, "PO4-3": 2}, ksp: 1.04e-24, sigma: 4.0}
  - {formula: "Pb3(PO4)2", ions: {"Pb+2": 3, "PO4-3": 2}, ksp: 8.0e-43, sigma: 5.0}
  - {formula: "Ba3(PO4)2", ions: {"Ba+2": 3, "PO4-3": 2}, ksp: 3.4e-23, sigma: 4.0}

e0:
  # M(z+) + z e- -> M(s): dG = -zFE0, отсюда dGf(ion) = +z*F*E0 (относительно стандартного водородного электрода)
  - {formula: "Cr+3", element_phase: s, z: 3, E0: -0.744, sigma: 3.0}
