# Дополнение к таблицам CRC: частицы, которых нет в CRC-таблицах пакета chemicals.
# Единицы: dGf, dHf - кДж/моль; S - Дж/(моль*К). sigma - оценка погрешности dGf, кДж/моль.
# Тип "direct" - значения из NBS Tables of Chemical Thermodynamic Properties (Wagman et al., 1982).
# Тип "ksp"    - dGf твердого вещества выведен из произведения растворимости (CRC Handbook,
#                "Solubility Product Constants") и dGf ионов из этой же базы.
# Тип "e0"     - dGf иона выведен из стандартного электродного потенциала (CRC Handbook): dGf = +zFE0.
# Значения внесены вручную и прошли независимую сверку (см. CHANGELOG). Погрешность выше, чем у CRC.

